[package]
name = "fush"
version = "0.9.2"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
regex = "1.13.1"
rustyline = "18.0.1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
which = "8.0.5"


[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7.1"