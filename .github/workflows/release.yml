name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: fush

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    container:
      image: rust:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            sqlite3 \
            ssh \
            pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test
        run: cargo run -- test

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-latest

    container:
      image: rust:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      - name: Generate third-party licenses
        run: cargo about generate about.hbs > THIRD-PARTY-LICENSES.txt

      - name: Get version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          mkdir release

          cp "target/release/$APP_NAME" release/
          cp LICENSE release/
          cp THIRD-PARTY-LICENSES.txt release/

          tar -czf \
            "$APP_NAME-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x86_64
          path: ${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      - name: Generate third-party licenses
        shell: bash
        run: cargo about generate about.hbs > THIRD-PARTY-LICENSES.txt

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir release

          cp "target/release/$APP_NAME.exe" release/
          cp LICENSE release/
          cp THIRD-PARTY-LICENSES.txt release/

          7z a \
            "$APP_NAME-v${{ steps.version.outputs.version }}-windows-x86_64.zip" \
            ./release/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x86_64
          path: ${{ env.APP_NAME }}-v${{ steps.version.outputs.version }}-windows-x86_64.zip

  release:
    name: Create Release
    needs:
      - linux
      - windows

    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x86_64
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x86_64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true